<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Apinizer AI Gateway istek akisi">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#3F51B5" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00AFEB"/>
    </marker>
    <marker id="arrowNavy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3F51B5"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#3F51B5">Apinizer AI Gateway - Istek Akisi</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="40" y="220" width="150" height="250" rx="14" fill="#fff" stroke="#3F51B5" stroke-width="2.5"/>
    <rect x="75" y="255" width="80" height="56" rx="8" fill="#e8f1fb" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="115" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#3F51B5">&lt;/&gt;</text>
    <text x="115" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#3F51B5">Istemci</text>
    <text x="115" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a627a">OpenAI SDK</text>
  </g>

  <!-- AI Proxy -->
  <g filter="url(#shadow)">
    <rect x="230" y="120" width="640" height="430" rx="18" fill="#fff" stroke="#3F51B5" stroke-width="2.5"/>
    <text x="550" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#3F51B5">AI Proxy</text>
    <text x="550" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a627a">Politikalar bu katmanda uygulanir</text>
  </g>

  <!-- Policy cards row 1 -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <g>
      <rect x="255" y="205" width="138" height="96" rx="10" fill="#f4f8fd" stroke="#3F51B5" stroke-width="1.5"/>
      <circle cx="278" cy="230" r="12" fill="#3F51B5"/>
      <text x="278" y="235" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">1</text>
      <text x="324" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#3F51B5">Kimlik</text>
      <text x="324" y="268" text-anchor="middle" font-size="13" fill="#4a627a">Yetki</text>
    </g>
    <g>
      <rect x="405" y="205" width="138" height="96" rx="10" fill="#f4f8fd" stroke="#3F51B5" stroke-width="1.5"/>
      <circle cx="428" cy="230" r="12" fill="#3F51B5"/>
      <text x="428" y="235" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">2</text>
      <text x="474" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#3F51B5">RAG</text>
      <text x="474" y="268" text-anchor="middle" font-size="13" fill="#4a627a">Injection</text>
    </g>
    <g>
      <rect x="555" y="205" width="138" height="96" rx="10" fill="#f4f8fd" stroke="#3F51B5" stroke-width="1.5"/>
      <circle cx="578" cy="230" r="12" fill="#3F51B5"/>
      <text x="578" y="235" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">3</text>
      <text x="624" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#3F51B5">Guardrail</text>
    </g>
    <g>
      <rect x="705" y="205" width="138" height="96" rx="10" fill="#f4f8fd" stroke="#3F51B5" stroke-width="1.5"/>
      <circle cx="728" cy="230" r="12" fill="#3F51B5"/>
      <text x="728" y="235" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">4</text>
      <text x="774" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#3F51B5">Semantic</text>
      <text x="774" y="268" text-anchor="middle" font-size="13" fill="#4a627a">Cache</text>
    </g>

    <!-- row 2 -->
    <g>
      <rect x="330" y="325" width="138" height="96" rx="10" fill="#f4f8fd" stroke="#3F51B5" stroke-width="1.5"/>
      <circle cx="353" cy="350" r="12" fill="#3F51B5"/>
      <text x="353" y="355" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">5</text>
      <text x="399" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#3F51B5">Token Kota</text>
    </g>
    <g>
      <rect x="480" y="325" width="170" height="96" rx="10" fill="#f4f8fd" stroke="#3F51B5" stroke-width="1.5"/>
      <circle cx="503" cy="350" r="12" fill="#3F51B5"/>
      <text x="503" y="355" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">6</text>
      <text x="565" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#3F51B5">AI Routing</text>
      <text x="565" y="382" text-anchor="middle" font-size="13" fill="#4a627a">Failover</text>
    </g>
    <g>
      <rect x="665" y="325" width="170" height="96" rx="10" fill="#e8f1fb" stroke="#3F51B5" stroke-width="2"/>
      <circle cx="688" cy="350" r="12" fill="#3F51B5"/>
      <text x="688" y="355" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">7</text>
      <text x="750" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#3F51B5">LLM</text>
      <text x="750" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#3F51B5">Cagri</text>
    </g>
  </g>

  <!-- RAG hub -->
  <g filter="url(#shadow)">
    <rect x="300" y="470" width="500" height="62" rx="12" fill="#fff" stroke="#00AFEB" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="550" y="496" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#00AFEB">RAG Hub</text>
    <text x="550" y="518" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a627a">Bilgi Tabani  |  Vector DB  |  Prompt Sablonlari</text>
  </g>
  <path d="M474 301 L474 470" stroke="#00AFEB" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowTeal)"/>

  <!-- LLM Provider -->
  <g filter="url(#shadow)">
    <rect x="920" y="220" width="230" height="250" rx="14" fill="#fff" stroke="#3F51B5" stroke-width="2.5"/>
    <ellipse cx="1035" cy="295" rx="48" ry="28" fill="#e8f1fb" stroke="#3F51B5" stroke-width="1.5"/>
    <rect x="1005" y="295" width="60" height="34" rx="6" fill="#e8f1fb" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="1035" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#3F51B5">LLM Provider</text>
    <text x="1035" y="388" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a627a">OpenAI, Anthropic</text>
    <text x="1035" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a627a">Ollama, Bedrock</text>
  </g>

  <!-- Arrows -->
  <path d="M190 345 L225 345" stroke="#3F51B5" stroke-width="3" fill="none" marker-end="url(#arrowNavy)"/>
  <rect x="186" y="306" width="46" height="22" rx="4" fill="#ffffff" stroke="#e8f1fb"/>
  <text x="209" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#3F51B5">Istek</text>

  <path d="M835 373 L915 340" stroke="#3F51B5" stroke-width="3" fill="none" marker-end="url(#arrowNavy)"/>
  <rect x="838" y="298" width="78" height="22" rx="4" fill="#ffffff" stroke="#e8f1fb"/>
  <text x="877" y="314" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#3F51B5">LLM Cagri</text>

  <path d="M1035 470 L1035 565 L115 565 L115 470" stroke="#3F51B5" stroke-width="2.5" stroke-dasharray="10 7" fill="none" marker-end="url(#arrowNavy)"/>
  <text x="575" y="590" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#3F51B5">Normalize OpenAI yaniti (streaming olabilir)</text>
</svg>
