<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Apinizer AI Gateway request flow">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#3F51B5" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#3F51B5">Apinizer AI Gateway  Request Flow</text>

  <g filter="url(#shadow)">
    <rect x="48" y="210" width="150" height="250" rx="14" fill="#fff" stroke="#3F51B5" stroke-width="2.5"/>
    <rect x="83" y="245" width="80" height="60" rx="8" fill="#e8f1fb" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="123" y="282" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#3F51B5">&lt;/&gt;</text>
    <text x="123" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#3F51B5">Client</text>
    <text x="123" y="368" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a627a">OpenAI SDK</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="250" y="120" width="620" height="430" rx="18" fill="#fff" stroke="#3F51B5" stroke-width="2.5"/>
    <text x="560" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#3F51B5">AI Proxy</text>
    <text x="560" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a627a">Policies run in this layer</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g>
      <rect x="280" y="210" width="130" height="88" rx="10" fill="#f4f8fd" stroke="#3F51B5" stroke-width="1.5"/>
      <circle cx="302" cy="234" r="12" fill="#3F51B5"/><text x="302" y="239" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">1</text>
      <text x="345" y="238" font-size="14" font-weight="700" fill="#3F51B5">Identity</text>
      <text x="345" y="258" font-size="13" fill="#4a627a">/ Auth</text>
    </g>
    <g>
      <rect x="430" y="210" width="130" height="88" rx="10" fill="#f4f8fd" stroke="#3F51B5" stroke-width="1.5"/>
      <circle cx="452" cy="234" r="12" fill="#3F51B5"/><text x="452" y="239" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">2</text>
      <text x="495" y="238" font-size="14" font-weight="700" fill="#3F51B5">RAG</text>
      <text x="495" y="258" font-size="13" fill="#4a627a">Injection</text>
    </g>
    <g>
      <rect x="580" y="210" width="130" height="88" rx="10" fill="#f4f8fd" stroke="#3F51B5" stroke-width="1.5"/>
      <circle cx="602" cy="234" r="12" fill="#3F51B5"/><text x="602" y="239" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">3</text>
      <text x="645" y="238" font-size="14" font-weight="700" fill="#3F51B5">Guardrail</text>
    </g>
    <g>
      <rect x="730" y="210" width="130" height="88" rx="10" fill="#f4f8fd" stroke="#3F51B5" stroke-width="1.5"/>
      <circle cx="752" cy="234" r="12" fill="#3F51B5"/><text x="752" y="239" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">4</text>
      <text x="795" y="232" font-size="13" font-weight="700" fill="#3F51B5">Semantic</text>
      <text x="795" y="252" font-size="13" fill="#4a627a">Cache</text>
    </g>
    <g>
      <rect x="355" y="330" width="130" height="88" rx="10" fill="#f4f8fd" stroke="#3F51B5" stroke-width="1.5"/>
      <circle cx="377" cy="354" r="12" fill="#3F51B5"/><text x="377" y="359" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">5</text>
      <text x="420" y="358" font-size="14" font-weight="700" fill="#3F51B5">Token Quota</text>
    </g>
    <g>
      <rect x="505" y="330" width="170" height="88" rx="10" fill="#f4f8fd" stroke="#3F51B5" stroke-width="1.5"/>
      <circle cx="527" cy="354" r="12" fill="#3F51B5"/><text x="527" y="359" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">6</text>
      <text x="590" y="352" font-size="14" font-weight="700" fill="#3F51B5">AI Routing</text>
      <text x="590" y="374" font-size="13" fill="#4a627a">+ Failover</text>
    </g>
    <g>
      <rect x="695" y="330" width="130" height="88" rx="10" fill="#e8f1fb" stroke="#3F51B5" stroke-width="2"/>
      <circle cx="717" cy="354" r="12" fill="#3F51B5"/><text x="717" y="359" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">7</text>
      <text x="760" y="358" font-size="14" font-weight="700" fill="#3F51B5">LLM Call</text>
    </g>
