  <g filter="url(#shadow)">
    <rect x="320" y="470" width="480" height="62" rx="12" fill="#fff" stroke="#00AFEB" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="560" y="498" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#00AFEB">RAG Hub</text>
    <text x="560" y="520" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a627a">Knowledge Base · Vector DB · Prompt Templates</text>
  </g>
  <path d="M505 298 L505 470" stroke="#00AFEB" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowTeal)"/>
  <defs>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00AFEB"/>
    </marker>
    <marker id="arrowNavy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3F51B5"/>
    </marker>
  </defs>

  <g filter="url(#shadow)">
    <rect x="930" y="210" width="210" height="250" rx="14" fill="#fff" stroke="#3F51B5" stroke-width="2.5"/>
    <ellipse cx="1035" cy="285" rx="48" ry="28" fill="#e8f1fb" stroke="#3F51B5" stroke-width="1.5"/>
    <rect x="1005" y="285" width="60" height="34" rx="6" fill="#e8f1fb" stroke="#3F51B5" stroke-width="1.5"/>
    <text x="1035" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#3F51B5">LLM Provider</text>
    <text x="1035" y="378" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a627a">OpenAI · Anthropic</text>
    <text x="1035" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a627a">Ollama · Bedrock&</text>
  </g>

  <path d="M198 335 L245 335" stroke="#3F51B5" stroke-width="3" fill="none" marker-end="url(#arrowNavy)"/>
  <text x="221" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#3F51B5">Request</text>

  <path d="M870 374 L925 335" stroke="#3F51B5" stroke-width="3" fill="none" marker-end="url(#arrowNavy)"/>
  <text x="897" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#3F51B5">LLM Call</text>

  <path d="M1035 460 L1035 560 L123 560 L123 465" stroke="#3F51B5" stroke-width="2.5" stroke-dasharray="10 7" fill="none" marker-end="url(#arrowNavy)"/>
  <text x="580" y="585" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#3F51B5">Normalized OpenAI response (streaming supported)</text>
</svg>
