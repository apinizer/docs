<svg viewBox="0 0 1880 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1880" height="700" fill="#FFFFFF"/>
<path d="M440,155.0 L480,155.0" stroke="#C9B8F0" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<path d="M880,155.0 L920,155.0" stroke="#C9B8F0" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<path d="M1320,155.0 L1360,155.0" stroke="#C9B8F0" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<rect x="40" y="30" width="400" height="250" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<circle cx="70" cy="63" r="15" fill="#F1EEFB" stroke="none" stroke-width="1.5"/>
<text x="70" y="68" font-size="14" font-weight="700" fill="#6E4FD1" text-anchor="middle">1</text>
<text x="96" y="68" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">CLIENT</text>
<text x="68" y="108" font-size="19.5" font-weight="700" fill="#101828" text-anchor="start">Generates a key pair</text>
<text x="68" y="135.0" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">The private key never leaves the device; only</text>
<text x="68" y="155.01" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">the public part is bound to the token.</text>
<rect x="480" y="30" width="400" height="250" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<circle cx="510" cy="63" r="15" fill="#F1EEFB" stroke="none" stroke-width="1.5"/>
<text x="510" y="68" font-size="14" font-weight="700" fill="#6E4FD1" text-anchor="middle">2</text>
<text x="536" y="68" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">AUTH SERVER</text>
<text x="508" y="108" font-size="19.5" font-weight="700" fill="#101828" text-anchor="start">Binds the token to the key</text>
<rect x="508" y="148" width="300" height="34" rx="8" fill="#F2F4F7" stroke="none" stroke-width="1.5"/>
<text x="524" y="170" font-size="14" font-weight="400" fill="#44546A" text-anchor="start" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">cnf.jkt = key SHA-256</text>
<rect x="920" y="30" width="400" height="250" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<circle cx="950" cy="63" r="15" fill="#F1EEFB" stroke="none" stroke-width="1.5"/>
<text x="950" y="68" font-size="14" font-weight="700" fill="#6E4FD1" text-anchor="middle">3</text>
<text x="976" y="68" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">REQUEST + PROOF</text>
<text x="948" y="108" font-size="19.5" font-weight="700" fill="#101828" text-anchor="start">Signed DPoP proof</text>
<text x="948" y="135.0" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">A short-lived, signed proof attached to every</text>
<text x="948" y="155.01" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">request.</text>
<rect x="948" y="178" width="46.5" height="25" rx="12.5" fill="#F2F4F7" stroke="none" stroke-width="1.5"/>
<text x="971.25" y="194.875" font-size="12.5" font-weight="400" fill="#44546A" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">htm</text>
<rect x="1002.5" y="178" width="46.5" height="25" rx="12.5" fill="#F2F4F7" stroke="none" stroke-width="1.5"/>
<text x="1025.75" y="194.875" font-size="12.5" font-weight="400" fill="#44546A" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">htu</text>
<rect x="1057.0" y="178" width="46.5" height="25" rx="12.5" fill="#F2F4F7" stroke="none" stroke-width="1.5"/>
<text x="1080.25" y="194.875" font-size="12.5" font-weight="400" fill="#44546A" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">iat</text>
<rect x="1111.5" y="178" width="46.5" height="25" rx="12.5" fill="#F2F4F7" stroke="none" stroke-width="1.5"/>
<text x="1134.75" y="194.875" font-size="12.5" font-weight="400" fill="#44546A" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">jti</text>
<rect x="1166.0" y="178" width="46.5" height="25" rx="12.5" fill="#F2F4F7" stroke="none" stroke-width="1.5"/>
<text x="1189.25" y="194.875" font-size="12.5" font-weight="400" fill="#44546A" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">ath</text>
<rect x="1360" y="30" width="400" height="250" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<circle cx="1390" cy="63" r="15" fill="#F1EEFB" stroke="none" stroke-width="1.5"/>
<text x="1390" y="68" font-size="14" font-weight="700" fill="#6E4FD1" text-anchor="middle">4</text>
<text x="1416" y="68" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">RESOURCE SERVER</text>
<text x="1388" y="108" font-size="19.5" font-weight="700" fill="#101828" text-anchor="start">Validates the proof</text>
<text x="1388" y="135.0" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">Is the signature valid? Does the token’s cnf.jkt</text>
<text x="1388" y="155.01" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">match the proof’s key?</text>
<rect x="520" y="370" width="430" height="190" rx="14" fill="#E9F7EF" stroke="none" stroke-width="1.5"/>
<circle cx="554" cy="404" r="16" fill="#1E9E5A" stroke="none" stroke-width="1.5"/>
<text x="554" y="410" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
<text x="580" y="410" font-size="11.5" font-weight="700" fill="#0E7A44" text-anchor="start" letter-spacing="0.8">ACCEPT</text>
<text x="548" y="448" font-size="19" font-weight="700" fill="#101828" text-anchor="start">Legitimate client</text>
<text x="548" y="475.0" font-size="14" font-weight="400" fill="#1D4A34" text-anchor="start">Signature valid, cnf.jkt matches → the request goes</text>
<text x="548" y="495.3" font-size="14" font-weight="400" fill="#1D4A34" text-anchor="start">through.</text>
<rect x="980" y="370" width="430" height="190" rx="14" fill="#FDEDEE" stroke="none" stroke-width="1.5"/>
<circle cx="1014" cy="404" r="16" fill="#D6284A" stroke="none" stroke-width="1.5"/>
<text x="1014" y="410" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">✕</text>
<text x="1040" y="410" font-size="11.5" font-weight="700" fill="#D6284A" text-anchor="start" letter-spacing="0.8">REJECT</text>
<text x="1008" y="448" font-size="19" font-weight="700" fill="#101828" text-anchor="start">Attacker</text>
<text x="1008" y="475.0" font-size="14" font-weight="400" fill="#7A2233" text-anchor="start">Token stolen, but no private key → the proof can’t</text>
<text x="1008" y="495.3" font-size="14" font-weight="400" fill="#7A2233" text-anchor="start">be signed.</text>
<path d="M1120.0,280 C1120.0,330 735.0,330 735.0,370" stroke="#1E9E5A" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<path d="M1560.0,280 L1195.0,370" stroke="#D6284A" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<rect x="40" y="590" width="1800" height="90" rx="14" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<rect x="40" y="590" width="6" height="90" fill="#6E4FD1" rx="3"/>
<text x="75" y="628" font-size="11" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">DISTRIBUTED</text>
<text x="75" y="645" font-size="11" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">CACHE</text>
<text x="210" y="638" font-size="15" font-weight="400" fill="#44546A" text-anchor="start">Every jti that is seen gets stored; the same proof is never accepted twice — </text>
<text x="870" y="638" font-size="15" font-weight="700" fill="#101828" text-anchor="start">replay protection.</text>
</svg>