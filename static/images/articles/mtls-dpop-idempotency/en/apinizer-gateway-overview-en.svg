<svg viewBox="0 0 1780 780" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1780" height="780" fill="#FFFFFF"/>
<path d="M420,220 L580,210" stroke="#B8C4D9" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<path d="M420,375 L580,400" stroke="#7DD3C0" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<path d="M1260,210 L1330,190" stroke="#B8A6EC" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<path d="M1260,430 L1330,460" stroke="#7DD3C0" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<rect x="40" y="140" width="380" height="300" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<text x="70" y="175" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">CONSUMERS</text>
<rect x="70" y="205" width="320" height="46" rx="10" fill="#F2F4F7" stroke="none" stroke-width="1.5"/>
<text x="90" y="235" font-size="16" font-weight="600" fill="#101828" text-anchor="start">Mobile &amp; SPA</text>
<rect x="70" y="263" width="320" height="46" rx="10" fill="#F2F4F7" stroke="none" stroke-width="1.5"/>
<text x="90" y="293" font-size="16" font-weight="600" fill="#101828" text-anchor="start">Internal microservices</text>
<rect x="70" y="321" width="320" height="46" rx="10" fill="#F2F4F7" stroke="none" stroke-width="1.5"/>
<text x="90" y="351" font-size="16" font-weight="600" fill="#101828" text-anchor="start">Partner / TPP</text>
<text x="70" y="401.0" font-size="13.5" font-weight="400" fill="#667085" text-anchor="start">Who arrives with DPoP, who carries replay</text>
<text x="70" y="420.575" font-size="13.5" font-weight="400" fill="#667085" text-anchor="start">risk — none of them change a line of code.</text>
<rect x="580" y="20" width="680" height="615" rx="16" fill="#FFFFFF" stroke="#DCE1EA" stroke-width="2"/>
<text x="610" y="60" font-size="11.5" font-weight="700" fill="#44546A" text-anchor="start" letter-spacing="0.8">APINIZER GATEWAY</text>
<circle cx="1065" cy="53" r="4" fill="#1E9E5A" stroke="none" stroke-width="1.5"/>
<text x="1078" y="58" font-size="12.5" font-weight="400" fill="#667085" text-anchor="start">no code involved</text>
<text x="610" y="105" font-size="27" font-weight="700" fill="#101828" text-anchor="start">Solved at the configuration level</text>
<text x="610" y="135.0" font-size="14.5" font-weight="400" fill="#667085" text-anchor="start">Security and trust aren’t re-solved at every request — they’re centralized in one</text>
<text x="610" y="156.025" font-size="14.5" font-weight="400" fill="#667085" text-anchor="start">place.</text>
<rect x="610" y="185" width="620" height="190" rx="14" fill="#F1EEFB" stroke="none" stroke-width="1.5"/>
<text x="635" y="217" font-size="11.5" font-weight="700" fill="#6E4FD1" text-anchor="start" letter-spacing="0.8">DPOP · SENDER-CONSTRAINED</text>
<rect x="635" y="235" width="270.0" height="115" rx="10" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<text x="655" y="270" font-size="16.5" font-weight="700" fill="#101828" text-anchor="start">JOSE Validation</text>
<text x="655" y="290" font-size="10.5" font-weight="700" fill="#6E4FD1" text-anchor="start" letter-spacing="0.8">INCOMING</text>
<text x="655" y="313.0" font-size="13" font-weight="400" fill="#667085" text-anchor="start">Validates the proof and the</text>
<text x="655" y="331.85" font-size="13" font-weight="400" fill="#667085" text-anchor="start">token’s binding to the key; blocks</text>
<text x="655" y="350.7" font-size="13" font-weight="400" fill="#667085" text-anchor="start">replay via jti.</text>
<rect x="920.0" y="235" width="275.0" height="115" rx="10" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<text x="940.0" y="270" font-size="16.5" font-weight="700" fill="#101828" text-anchor="start">JOSE Implementation</text>
<text x="940.0" y="290" font-size="10.5" font-weight="700" fill="#6E4FD1" text-anchor="start" letter-spacing="0.8">OUTGOING</text>
<text x="940.0" y="313.0" font-size="13" font-weight="400" fill="#667085" text-anchor="start">Generates the proof when Apinizer</text>
<text x="940.0" y="331.85" font-size="13" font-weight="400" fill="#667085" text-anchor="start">calls an external DPoP-protected</text>
<text x="940.0" y="350.7" font-size="13" font-weight="400" fill="#667085" text-anchor="start">API.</text>
<rect x="610" y="395" width="620" height="120" rx="14" fill="#E7F6F4" stroke="none" stroke-width="1.5"/>
<text x="635" y="427" font-size="11.5" font-weight="700" fill="#0F8A7A" text-anchor="start" letter-spacing="0.8">IDEMPOTENCY · API PROXY SETTING</text>
<text x="635" y="455.0" font-size="14" font-weight="400" fill="#1D3A36" text-anchor="start">Reads the key from the Idempotency-Key header, or derives it from business</text>
<text x="635" y="475.3" font-size="14" font-weight="400" fill="#1D3A36" text-anchor="start">data (e.g. a consent ID); stores the first response and matches repeats</text>
<text x="635" y="495.6" font-size="14" font-weight="400" fill="#1D3A36" text-anchor="start">against it.</text>
<rect x="610" y="535" width="620" height="66" rx="12" fill="#0B1220" stroke="none" stroke-width="1.5"/>
<text x="635" y="562" font-size="10.5" font-weight="700" fill="#9AA7C0" text-anchor="start" letter-spacing="0.8">DISTRIBUTED</text>
<text x="635" y="579" font-size="10.5" font-weight="700" fill="#9AA7C0" text-anchor="start" letter-spacing="0.8">CACHE</text>
<rect x="745" y="549" width="2" height="38" rx="0" fill="#2A3550" stroke="none" stroke-width="1.5"/>
<text x="770" y="565" font-size="13.5" font-weight="400" fill="#D6DCEA" text-anchor="start">Serves both mechanisms from the same memory:</text>
<text x="770" y="585" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">jti  &amp;  Idempotency-Key</text>
<rect x="1330" y="100" width="410" height="170" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<text x="1360" y="135" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">BACKEND SERVICES</text>
<text x="1360" y="165" font-size="19" font-weight="700" fill="#101828" text-anchor="start">Business logic</text>
<text x="1360" y="190.0" font-size="13.5" font-weight="400" fill="#667085" text-anchor="start">Doesn’t need to know what DPoP is, or how the</text>
<text x="1360" y="209.575" font-size="13.5" font-weight="400" fill="#667085" text-anchor="start">repeat request was caught.</text>
<rect x="1330" y="320" width="410" height="220" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<text x="1360" y="355" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">EXTERNAL DPOP API</text>
<text x="1360" y="385" font-size="19" font-weight="700" fill="#101828" text-anchor="start">Open banking</text>
<text x="1360" y="410.0" font-size="13.5" font-weight="400" fill="#667085" text-anchor="start">External services (e.g. account-info providers)</text>
<text x="1360" y="429.575" font-size="13.5" font-weight="400" fill="#667085" text-anchor="start">that expect a proof. Apinizer generates it.</text>
<rect x="40" y="675" width="1700" height="80" rx="14" fill="#0B1220" stroke="none" stroke-width="1.5"/>
<text x="70" y="708" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="start">One Gateway,</text>
<text x="70" y="728" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="start">Different Settings</text>
<rect x="255" y="693" width="2" height="44" rx="16" fill="#2A3550" stroke="none" stroke-width="1.5"/>
<text x="285" y="721" font-size="15" font-weight="400" fill="#D6DCEA" text-anchor="start">Security (DPoP) and trust (Idempotency) — same gateway, same distributed memory. Your applications stay focused on their actual business.</text>
</svg>