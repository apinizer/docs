<svg viewBox="0 0 1880 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1880" height="720" fill="#FFFFFF"/>
<rect x="40" y="140" width="380" height="240" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<circle cx="70" cy="173" r="15" fill="#E7F6F4" stroke="none" stroke-width="1.5"/>
<text x="70" y="178" font-size="14" font-weight="700" fill="#0F8A7A" text-anchor="middle">1</text>
<text x="96" y="178" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">CLIENT</text>
<text x="68" y="218" font-size="19" font-weight="700" fill="#101828" text-anchor="start">Sends a request with a key</text>
<rect x="68" y="240" width="50.0" height="27" rx="13.5" fill="#F2F4F7" stroke="none" stroke-width="1.5"/>
<text x="93.0" y="257.875" font-size="12.5" font-weight="400" fill="#44546A" text-anchor="middle">POST</text>
<rect x="128.0" y="240" width="121.5" height="27" rx="13.5" fill="#E7F6F4" stroke="none" stroke-width="1.5"/>
<text x="188.75" y="257.875" font-size="12.5" font-weight="400" fill="#0F8A7A" text-anchor="middle">Idempotency-Key</text>
<text x="68" y="295.0" font-size="13.5" font-weight="400" fill="#667085" text-anchor="start">timeout · retry · double-click · failover →</text>
<text x="68" y="314.575" font-size="13.5" font-weight="400" fill="#667085" text-anchor="start">the same request repeats</text>
<path d="M420,260.0 L480,260.0" stroke="#7DD3C0" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<rect x="480" y="130" width="380" height="260" rx="16" fill="#FFFFFF" stroke="#0F8A7A" stroke-width="2"/>
<circle cx="510" cy="163" r="15" fill="#E7F6F4" stroke="none" stroke-width="1.5"/>
<text x="510" y="168" font-size="14" font-weight="700" fill="#0F8A7A" text-anchor="middle">2</text>
<text x="536" y="168" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">GATEWAY / SERVER</text>
<text x="508" y="208" font-size="19" font-weight="700" fill="#101828" text-anchor="start">Looks up the key in cache</text>
<text x="508" y="235.0" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Has this key been seen before? The answer</text>
<text x="508" y="255.3" font-size="14" font-weight="400" fill="#667085" text-anchor="start">splits into two paths.</text>
<path d="M860,180 L920,125.0" stroke="#E4E7EC" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<rect x="920" y="20" width="400" height="210" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<text x="948" y="54" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">FIRST REQUEST · NO KEY</text>
<text x="948" y="88" font-size="18.5" font-weight="700" fill="#101828" text-anchor="start">Request is processed</text>
<text x="948" y="115.0" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">Key is not found in cache → the request is</text>
<text x="948" y="135.01" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">forwarded to the backend.</text>
<path d="M1320,125.0 L1360,125.0" stroke="#E4E7EC" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<rect x="1360" y="20" width="380" height="210" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<text x="1388" y="54" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">BACKEND</text>
<text x="1388" y="88" font-size="18.5" font-weight="700" fill="#101828" text-anchor="start">Business logic runs</text>
<text x="1388" y="115.0" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">The response is stored in the cache together</text>
<text x="1388" y="135.01" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">with the key.</text>
<text x="1388" y="137" font-size="1" font-weight="400" fill="#101828" text-anchor="start"></text>
<path d="M860,350 L920,415.0" stroke="#1E9E5A" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<rect x="920" y="300" width="820" height="230" rx="14" fill="#E9F7EF" stroke="none" stroke-width="1.5"/>
<text x="950" y="338" font-size="11.5" font-weight="700" fill="#0E7A44" text-anchor="start" letter-spacing="0.8">REPEAT · KEY EXISTS</text>
<text x="950" y="376" font-size="20" font-weight="700" fill="#101828" text-anchor="start">The stored response is returned</text>
<text x="950" y="406.0" font-size="14.5" font-weight="400" fill="#1D4A34" text-anchor="start">Same key found in cache → the gateway returns the stored response; the backend is never bothered. No</text>
<text x="950" y="427.025" font-size="14.5" font-weight="400" fill="#1D4A34" text-anchor="start">matter how many repeats arrive, the result never changes.</text>
<path d="M520,390 L520,560" stroke="#E4E7EC" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<rect x="40" y="560" width="590" height="110" rx="14" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<rect x="40" y="560" width="6" height="110" fill="#0F8A7A" rx="3"/>
<text x="75" y="600" font-size="11" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">DISTRIBUTED</text>
<text x="75" y="617" font-size="11" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">CACHE</text>
<text x="230" y="608.0" font-size="14.5" font-weight="400" fill="#44546A" text-anchor="start">The key → response mapping is kept here.</text>
<rect x="660" y="560" width="1080" height="110" rx="14" fill="#0E7A44" stroke="none" stroke-width="1.5"/>
<rect x="690" y="600" width="124.80000000000001" height="32" rx="16.0" fill="#0B5C36" stroke="none" stroke-width="1.5"/>
<text x="752.4" y="620.9" font-size="14" font-weight="400" fill="#B7F0D2" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">exactly-once</text>
<rect x="870" y="592" width="2" height="48" rx="16" fill="#1D7A50" stroke="none" stroke-width="1.5"/>
<text x="895" y="620" font-size="15.5" font-weight="400" fill="#FFFFFF" text-anchor="start">The operation happens exactly once.</text>
</svg>