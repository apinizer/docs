<svg viewBox="0 0 1900 570" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1900" height="570" fill="#FFFFFF"/>
<path d="M380,110 L440,110" stroke="#E7B94A" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<path d="M910,110 L970,110" stroke="#E37E92" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<rect x="40" y="20" width="340" height="200" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<text x="66" y="54" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">CLIENT</text>
<text x="66" y="86" font-size="17.5" font-weight="700" fill="#101828" text-anchor="start">Presents a certificate</text>
<text x="66" y="112.0" font-size="13.3" font-weight="400" fill="#667085" text-anchor="start">If it doesn’t hold the certificate that</text>
<text x="66" y="131.285" font-size="13.3" font-weight="400" fill="#667085" text-anchor="start">established the channel, the conversation</text>
<text x="66" y="150.57" font-size="13.3" font-weight="400" fill="#667085" text-anchor="start">never starts.</text>
<rect x="440" y="20" width="470" height="220" rx="16" fill="#FFF6E5" stroke="#F0C875" stroke-width="2"/>
<rect x="466" y="42" width="105.12" height="25" rx="12.5" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="518.56" y="58.7" font-size="12" font-weight="400" fill="#C87A00" text-anchor="middle">mTLS ≠ mutual</text>
<text x="466" y="86" font-size="11" font-weight="700" fill="#C87A00" text-anchor="start" letter-spacing="0.8">REVERSE PROXY / LB · TLS TERMINATION</text>
<text x="466" y="110" font-size="19" font-weight="700" fill="#101828" text-anchor="start">mTLS ends here</text>
<text x="466" y="138.0" font-size="13.6" font-weight="400" fill="#6B5620" text-anchor="start">In an enterprise architecture, something almost always sits</text>
<text x="466" y="157.72" font-size="13.6" font-weight="400" fill="#6B5620" text-anchor="start">in the middle; client identity erodes at the first hop.</text>
<rect x="970" y="20" width="380" height="200" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<rect x="996" y="42" width="117.60000000000001" height="25" rx="12.5" fill="#FDEDEE" stroke="none" stroke-width="1.5"/>
<text x="1054.8" y="58.7" font-size="12" font-weight="400" fill="#D6284A" text-anchor="middle">identity lost ×</text>
<text x="996" y="86" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">BACKEND</text>
<text x="996" y="110" font-size="17.5" font-weight="700" fill="#101828" text-anchor="start">Can’t see the identity</text>
<text x="996" y="136.0" font-size="13.3" font-weight="400" fill="#667085" text-anchor="start">Carrying it forward requires extra headers plus</text>
<text x="996" y="155.285" font-size="13.3" font-weight="400" fill="#667085" text-anchor="start">extra trust chains.</text>
<rect x="1410" y="20" width="400" height="200" rx="16" fill="#FDEDEE" stroke="none" stroke-width="1.5"/>
<text x="1436" y="54" font-size="11.5" font-weight="700" fill="#D6284A" text-anchor="start" letter-spacing="0.8">CORE CONSTRAINT</text>
<text x="1436" y="86" font-size="17.5" font-weight="700" fill="#101828" text-anchor="start">Identity is bound to the channel</text>
<text x="1436" y="114.0" font-size="13.3" font-weight="400" fill="#7A2233" text-anchor="start">Not optional — it belongs to the TLS connection</text>
<text x="1436" y="133.285" font-size="13.3" font-weight="400" fill="#7A2233" text-anchor="start">itself.</text>
<path d="M675.0,240 C675.0,300 190,300 190,335" stroke="#D9C08A" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<path d="M675.0,240 C675.0,300 900,300 900,335" stroke="#D9C08A" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<path d="M675.0,240 C675.0,300 1590,300 1590,335" stroke="#D9C08A" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" fill="none"/>
<text x="40" y="350" font-size="13" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="1.2">OPERATIONAL OVERHEAD — REPEATS WITH EVERY NEW APPLICATION</text>
<rect x="40" y="380" width="590" height="250" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<circle cx="70" cy="412" r="15" fill="#FFF6E5" stroke="none" stroke-width="1.5"/>
<text x="70" y="417" font-size="13.5" font-weight="700" fill="#C87A00" text-anchor="middle">1</text>
<text x="96" y="417" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">CERTIFICATE LIFESPAN</text>
<text x="68" y="456" font-size="19.5" font-weight="700" fill="#101828" text-anchor="start">Lifetimes are shrinking</text>
<text x="68" y="484.0" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">Public TLS lifetimes are stepping down — the industry is heading toward</text>
<text x="68" y="504.01" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">~47 days. Internal PKI / service-mesh certs already rotate hourly or</text>
<text x="68" y="524.02" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">daily.</text>
<rect x="66" y="584" width="538" height="32" rx="8" fill="#FFF6E5" stroke="none" stroke-width="1.5"/>
<text x="82" y="605" font-size="12.8" font-weight="600" fill="#8A5A00" text-anchor="start">renewal → a constantly running machine</text>
<rect x="660" y="380" width="590" height="250" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<circle cx="690" cy="412" r="15" fill="#FFF6E5" stroke="none" stroke-width="1.5"/>
<text x="690" y="417" font-size="13.5" font-weight="700" fill="#C87A00" text-anchor="middle">2</text>
<text x="716" y="417" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">CERTIFICATE MANAGEMENT</text>
<text x="688" y="456" font-size="19.5" font-weight="700" fill="#101828" text-anchor="start">Every application manages a certificate</text>
<text x="688" y="484.0" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">Dozens, sometimes hundreds, of internal services — each one must store it</text>
<text x="688" y="504.01" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">securely, renew it before expiry, and distribute it.</text>
<rect x="686" y="584" width="538" height="32" rx="8" fill="#FDEDEE" stroke="none" stroke-width="1.5"/>
<text x="702" y="605" font-size="12.8" font-weight="600" fill="#A31432" text-anchor="start">one missed rotation → a silent outage</text>
<rect x="1280" y="380" width="590" height="250" rx="16" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>
<circle cx="1310" cy="412" r="15" fill="#FFF6E5" stroke="none" stroke-width="1.5"/>
<text x="1310" y="417" font-size="13.5" font-weight="700" fill="#C87A00" text-anchor="middle">3</text>
<text x="1336" y="417" font-size="11.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">IDENTITY PROPAGATION</text>
<text x="1308" y="456" font-size="19.5" font-weight="700" fill="#101828" text-anchor="start">Identity doesn’t travel with the request</text>
<text x="1308" y="484.0" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">Identity belongs to the TLS connection. Once a proxy / LB / ingress sits</text>
<text x="1308" y="504.01" font-size="13.8" font-weight="400" fill="#667085" text-anchor="start">in the middle and terminates TLS, client identity erodes at the first hop.</text>
<rect x="1306" y="584" width="538" height="32" rx="8" fill="#FFF6E5" stroke="none" stroke-width="1.5"/>
<text x="1322" y="605" font-size="12.8" font-weight="600" fill="#8A5A00" text-anchor="start">requires extra headers + trust chain</text>
</svg>