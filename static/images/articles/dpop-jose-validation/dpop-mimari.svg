<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e67e22"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a99a8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="800" fill="#ffffff"/>
  <text x="720" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#2c3e50">DPoP Çalışma Akışı</text>

  <!-- Keycloak -->
  <rect x="560" y="90" width="340" height="140" rx="10" fill="#f5f8fc" stroke="#2f5b9e" stroke-width="2.5"/>
  <text x="730" y="130" text-anchor="middle" font-size="24" font-weight="bold" fill="#2f5b9e">Keycloak</text>
  <text x="730" y="158" text-anchor="middle" font-size="16" fill="#5a6b7b">Identity Provider</text>
  <text x="730" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Token'a cnf.jkt gömer ve imzalar</text>

  <!-- cnf.jkt note -->
  <rect x="990" y="100" width="370" height="120" rx="10" fill="#fffaf4" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1175" y="138" text-anchor="middle" font-size="19" font-weight="bold" fill="#e67e22">cnf.jkt</text>
  <text x="1175" y="168" text-anchor="middle" font-size="15" fill="#5a4632">Proof'taki public key'in SHA-256</text>
  <text x="1175" y="192" text-anchor="middle" font-size="15" fill="#5a4632">parmak izi token'a bağlanır</text>
  <line x1="900" y1="160" x2="990" y2="160" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- get_token.py -->
  <rect x="110" y="300" width="350" height="205" rx="10" fill="#f5f8fc" stroke="#2f5b9e" stroke-width="2.5"/>
  <text x="285" y="340" text-anchor="middle" font-size="21" font-weight="bold" fill="#2f5b9e">Client: Token Alma</text>
  <line x1="150" y1="356" x2="420" y2="356" stroke="#c9d6e4" stroke-width="1.5"/>
  <text x="285" y="388" text-anchor="middle" font-size="15" fill="#3d4f60">Anahtar çiftini yükler veya üretir</text>
  <text x="285" y="415" text-anchor="middle" font-size="15" fill="#3d4f60">Token endpoint için proof üretir</text>
  <text x="285" y="442" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">Token'ı diske kaydeder</text>
  <text x="285" y="469" text-anchor="middle" font-size="15" fill="#1e7d4e">cnf.jkt eşleşmesini doğrular</text>

  <!-- call_api.py -->
  <rect x="110" y="565" width="350" height="120" rx="10" fill="#f5f8fc" stroke="#2f5b9e" stroke-width="2.5"/>
  <text x="285" y="605" text-anchor="middle" font-size="21" font-weight="bold" fill="#2f5b9e">Client: API Çağrısı</text>
  <line x1="150" y1="621" x2="420" y2="621" stroke="#c9d6e4" stroke-width="1.5"/>
  <text x="285" y="650" text-anchor="middle" font-size="15" fill="#3d4f60">Aynı anahtarla her istek için</text>
  <text x="285" y="673" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">yeni proof üretip gateway'e gönderir</text>

  <!-- Apinizer Gateway -->
  <rect x="560" y="330" width="370" height="285" rx="10" fill="#fffdfa" stroke="#e67e22" stroke-width="3"/>
  <text x="745" y="370" text-anchor="middle" font-size="23" font-weight="bold" fill="#e67e22">Apinizer Gateway</text>
  <text x="745" y="396" text-anchor="middle" font-size="15" fill="#5a6b7b">JOSE Validation + DPoP</text>
  <line x1="600" y1="410" x2="890" y2="410" stroke="#f0d9c0" stroke-width="1.5"/>
  <text x="600" y="438" font-size="15" fill="#3d4f60">Access token imzası (JWKS)</text>
  <text x="600" y="464" font-size="15" fill="#3d4f60">Proof imzası (jwk ile, ES256)</text>
  <text x="600" y="490" font-size="15" fill="#3d4f60">iat . htm . htu</text>
  <text x="600" y="516" font-size="15" font-weight="bold" fill="#2c3e50">cnf.jkt = jwk parmak izi (bağ)</text>
  <text x="600" y="542" font-size="15" fill="#3d4f60">ath . jti replay</text>
  <text x="600" y="572" font-size="15" fill="#1e7d4e">Geçerse: istek backend'e iletilir</text>

  <!-- Backend API -->
  <rect x="1090" y="420" width="270" height="110" rx="10" fill="#f5f8fc" stroke="#2f5b9e" stroke-width="2.5"/>
  <text x="1225" y="468" text-anchor="middle" font-size="21" font-weight="bold" fill="#2f5b9e">Backend API</text>
  <text x="1225" y="498" text-anchor="middle" font-size="15" fill="#5a6b7b">Korunan servis</text>

  <!-- Arrow 1: get_token -> Keycloak -->
  <path d="M 380 300 C 440 250 500 210 555 180" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="405" y="242" font-size="15" font-weight="bold" fill="#2c3e50">1. Token isteği + proof</text>
  <text x="405" y="264" font-size="13" fill="#5a6b7b">(public key proof içinde)</text>

  <!-- Arrow 2: Keycloak -> get_token -->
  <path d="M 585 235 C 520 268 460 292 415 308" fill="none" stroke="#2c3e50" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="452" y="330" font-size="15" font-weight="bold" fill="#2c3e50">2. Token (cnf.jkt içerir)</text>

  <!-- Arrow 3: call_api -> Gateway -->
  <path d="M 460 610 C 510 590 530 560 555 528" fill="none" stroke="#e67e22" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="440" y="548" font-size="15" font-weight="bold" fill="#e67e22">3. Her istekte</text>
  <text x="440" y="570" font-size="13" fill="#b06214">Authorization + DPoP proof</text>

  <!-- Arrow 4: Gateway -> Backend -->
  <path d="M 930 472 L 1085 472" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1007" y="456" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">4. Doğrulanmış istek</text>

  <!-- JWKS dashed: Gateway -> Keycloak -->
  <path d="M 800 330 C 790 300 775 265 760 235" fill="none" stroke="#8a99a8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <text x="815" y="290" font-size="14" fill="#8a99a8">JWKS URL (public key)</text>

  <!-- Bottom note -->
  <rect x="460" y="680" width="900" height="86" rx="10" fill="#f7f9fb" stroke="#b9c6d3" stroke-width="1.5"/>
  <text x="910" y="714" text-anchor="middle" font-size="15" fill="#3d4f60">Aynı anahtar hem token'ı aldırır hem her isteği imzalar. cnf.jkt sabittir; değişen tek şey her proof'un</text>
  <text x="910" y="740" text-anchor="middle" font-size="15" fill="#3d4f60">jti/iat/htu/ath payload'ıdır. Çalınan token, private key olmadan geçerli proof üretilemediği için kullanılamaz.</text>
</svg>
