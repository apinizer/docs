openapi: 3.0.1
info:
  title: Apinizer Management APIs
  description: "As an alternative to managing your Apinizer with the management UI,\
    \ you can manage it using Management APIs."
  license:
    name: Apache 2.0
    url: https://docs.apinizer.com
  version: 1.0.1
servers:
- url: http://167.86.118.166:32080
  description: Generated server url
tags:
- name: EnvironmentVariable
  description: "Set of endpoints for Creating, Retrieving, Updating and Deleting EnvironmentVariable."
- name: ApiProxyGroup
  description: "Set of endpoints for Creating, Retrieving, Updating and Deleting Api\
    \ Proxy Group."
- name: Policy
  description: "Set of endpoints for Creating, Retrieving, Updating and Deleting ApiProxy."
- name: Environment
  description: Set of endpoints for Listing Environments.
- name: RLCL
  description: "Set of endpoints for Creating, Retrieving, Updating and Deleting Rate\
    \ Limit Control Lists."
- name: Auth
  description: Set of endpoints for Creating and Retrieving Authorization Tokens.
- name: GeoLocation
  description: Set of endpoints for Managing Geolocation Settings.
- name: ApiProxy
  description: "Set of endpoints for Creating, Retrieving, Updating and Deleting ApiProxy."
- name: Test
  description: Test endpoints
- name: Connection
  description: "Set of endpoints for Creating, Retrieving, Updating and Deleting ConnectionConfig."
- name: Project
  description: Set of endpoints for Listing Projects.
- name: Credential
  description: Set of endpoints for Listing Credentials.
- name: CredentialOrganization
  description: Set of endpoints for managing Credential Organizations.
- name: TrafficLogSettings
  description: Set of endpoints for Managing API Proxy Traffic Log Settings.
- name: IPGroups
  description: "Set of endpoints for Creating, Retrieving, Updating and Deleting IP\
    \ Groups."
