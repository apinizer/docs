      - GeoLocation
      summary: Upload MMDB file for Geolocation
      description: Uploads MMDB file for Geolocation Settings
      operationId: uploadMMDBFile
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  description: MMDB file to be uploaded
                  format: binary
                fileName:
                  type: string
                  description: File name
      responses:
        "401":
          description: not authorized for this operation!
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOpsResponseError'
        "200":
          description: successful operation!
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOpsResponseSuccess'
        "500":
          description: internal error!
          content:
            application/json:
              schema:
